<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>اتاق مشترک جلسه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6C5CE7}a:hover{color:#5243C9}
</style>
</head>
<body>
<div dir="rtl" style="width:390px;min-height:844px;box-sizing:border-box;position:relative;padding-bottom:84px;background:#F4F4FA;color:#17172A;font-family:Vazirmatn,system-ui,sans-serif">
<header style="display:flex;align-items:center;gap:10px;padding:14px 16px 6px"><a href="Main.html" aria-label="بازگشت" style="width:44px;height:44px;border-radius:14px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#17172A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a><h1 style="margin:0;font-size:19px;font-weight:900;flex:1">جلسه با سارا</h1><div style="display:flex;align-items:center;gap:4px" aria-label="حاضرها: تو و سارا"><span aria-hidden="true" style="width:30px;height:30px;border-radius:50%;background:#6C5CE7;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none">ت</span><span style="width:9px;height:9px;border-radius:50%;background:#00B894;margin-inline-start:-10px;margin-top:20px;border:2px solid #F4F4FA"></span><span aria-hidden="true" style="width:30px;height:30px;border-radius:50%;background:#00A383;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none">س</span><span style="width:9px;height:9px;border-radius:50%;background:#00B894;margin-inline-start:-10px;margin-top:20px;border:2px solid #F4F4FA"></span></div></header>
<main style="padding:6px 16px 24px;display:flex;flex-direction:column;gap:12px">
<div role="tablist" style="display:flex;gap:6px;background:#E9E9F2;border-radius:14px;padding:4px">
<button type="button" role="tab" aria-selected="true" style="flex:1;min-height:40px;border:0;border-radius:11px;background:#fff;font:inherit;font-weight:800;font-size:13px">تمرکز</button>
<button type="button" role="tab" aria-selected="false" style="flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;font:inherit;font-weight:700;font-size:13px;color:#5F5F75;display:flex;align-items:center;justify-content:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.5" width="12.5" height="11" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3"/></svg> تصویر</button>
</div>
<section aria-label="زمان‌سنج مشترک" style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(30,30,80,.05);text-align:center;padding:22px 16px">
<div style="font-size:12.5px;color:#00805F;font-weight:800;display:flex;justify-content:center;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#00B894"></span>هر دو دارید کار می‌کنید</div>
<div dir="ltr" style="font-size:68px;font-weight:900;letter-spacing:1px;margin:6px 0 2px;font-variant-numeric:tabular-nums">۳۲:۱۴</div>
<div style="height:8px;border-radius:4px;background:#EFEFF6;overflow:hidden;margin:8px 10px 16px"><div style="width:36%;height:100%;background:#6C5CE7;border-radius:4px"></div></div>
<div style="display:flex;justify-content:center;gap:12px">
<button type="button" aria-label="از اول" style="width:52px;height:52px;border-radius:50%;border:0;background:#EFEFF6;color:#17172A;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
<button type="button" aria-label="مکث" style="width:64px;height:64px;border-radius:50%;border:0;background:#6C5CE7;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
<button type="button" aria-label="تمام کردن جلسه" style="width:52px;height:52px;border-radius:50%;border:0;background:#E1F7F0;color:#00805F;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
</div>
<div style="font-size:11.5px;color:#5F5F75;margin-top:10px">۵۰ دقیقه · هر کدام از شما می‌تواند مکث کند</div>
</section>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<div style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(30,30,80,.05);padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid #EEEBFF"><div style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:26px;height:26px;border-radius:50%;background:#6C5CE7;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;flex:none">ت</span><b style="font-size:13px">تو</b><span style="flex:1"></span><span style="font-size:11px;color:#5F5F75">قصدِ این جلسه</span></div><p style="margin:0;font-size:13.5px;line-height:1.7">فصل ۳ را تا آخر بخش روش بنویسم</p></div>
<div style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(30,30,80,.05);padding:12px;display:flex;flex-direction:column;gap:8px;"><div style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:26px;height:26px;border-radius:50%;background:#00A383;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;flex:none">س</span><b style="font-size:13px">سارا</b><span style="flex:1"></span><span style="font-size:11px;color:#5F5F75">قصدِ این جلسه</span></div><p style="margin:0;font-size:13px;color:#5F5F75">هنوز ننوشته</p></div>
</div>
<section style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(30,30,80,.05);display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px">چک‌لیست من<span style="flex:1"></span><span style="font-size:11.5px;color:#5F5F75;display:flex;align-items:center;gap:4px;font-weight:700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg> فقط تو می‌بینی</span></div>
<label style="display:flex;gap:10px;align-items:center;font-size:13.5px;min-height:32px"><input type="checkbox" checked style="width:20px;height:20px;accent-color:#6C5CE7"><span style="text-decoration:line-through;color:#5F5F75">جدول نمونه‌ها</span></label>
<label style="display:flex;gap:10px;align-items:center;font-size:13.5px;min-height:32px"><input type="checkbox" style="width:20px;height:20px;accent-color:#6C5CE7">پاراگراف ابزار پژوهش</label>
<label style="display:flex;gap:10px;align-items:center;font-size:13.5px;min-height:32px"><input type="checkbox" style="width:20px;height:20px;accent-color:#6C5CE7">منبع‌ها</label>
</section>
</main>

</div>
</body>
</html>
