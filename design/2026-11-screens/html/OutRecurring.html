<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>بریم بیرون — برنامهٔ ماهانه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6C5CE7}a:hover{color:#5243C9}
</style>
</head>
<body>
<div dir="rtl" style="width:390px;min-height:844px;box-sizing:border-box;position:relative;padding-bottom:84px;background:#F4F4FA;color:#17172A;font-family:Vazirmatn,system-ui,sans-serif">
<header style="display:flex;align-items:center;gap:10px;padding:14px 16px 6px"><a href="Main.html" aria-label="بازگشت" style="width:44px;height:44px;border-radius:14px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#17172A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a><h1 style="margin:0;font-size:19px;font-weight:900;flex:1">تکرار ماهانه</h1></header>
<main style="padding:6px 16px 24px;display:flex;flex-direction:column;gap:14px">
<section style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(30,30,80,.05);display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:44px;border-radius:14px;background:#EEEBFF;color:#6C5CE7;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10V9a3 3 0 0 1 3-3h11l-3-3M20 14v1a3 3 0 0 1-3 3H6l3 3"/></svg></span><div style="flex:1"><b style="font-size:15px">شام جمعه با دخترا</b><div style="font-size:12.5px;color:#5F5F75">هر ماه، اولین جمعه</div></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:800">کی</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#6C5CE7;color:#fff;border:2px solid #6C5CE7">اولین جمعه</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">آخرین شنبه</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">هر دو هفته</button></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:800">جا</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#6C5CE7;color:#fff;border:2px solid #6C5CE7">هر بار رأی بدهیم</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">همیشه همین‌جا</button></div></div>
<span style="font-size:12.5px;color:#5F5F75;line-height:1.8">یک هفته قبل از هر قرار، از همه می‌پرسیم میان یا نه و جا را رأی می‌دهیم. اگر کمتر از ۳ نفر بیایند، به تو خبر می‌دهیم.</span>
</section>
<section style="background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(30,30,80,.05)"><b style="font-size:14px">قرارهای بعدی</b><div style="margin-top:6px"><div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E9E9F2"><span style="width:44px;text-align:center"><b style="display:block;font-size:17px">۲</b><span style="font-size:11px;color:#5F5F75">آذر</span></span><span style="flex:1;font-size:13px">جمعه، ۱۹:۳۰ · رستوران</span><span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:#E1F7F0;color:#00805F">قطعی</span></div><div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E9E9F2"><span style="width:44px;text-align:center"><b style="display:block;font-size:17px">۷</b><span style="font-size:11px;color:#5F5F75">دی</span></span><span style="flex:1;font-size:13px">جمعه، ۱۹:۳۰ · جا هنوز نه</span><span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:#EEEBFF;color:#5243C9">رأی‌گیری</span></div><div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #E9E9F2"><span style="width:44px;text-align:center"><b style="display:block;font-size:17px">۵</b><span style="font-size:11px;color:#5F5F75">بهمن</span></span><span style="flex:1;font-size:13px">جمعه، ۱۹:۳۰</span><span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:#EFEFF6;color:#5F5F75">بعداً</span></div></div></section>
<button type="button" style="width:100%;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:0;font:inherit;font-size:14px;font-weight:800;text-decoration:none;background:#6C5CE7;color:#fff">ذخیرهٔ تکرار</button>
</main>

</div>
</body>
</html>
