<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پیشنهاد جلسه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6C5CE7}a:hover{color:#5243C9}
</style>
</head>
<body>
<div dir="rtl" style="width:390px;min-height:844px;box-sizing:border-box;position:relative;padding-bottom:84px;background:#F4F4FA;color:#17172A;font-family:Vazirmatn,system-ui,sans-serif">
<header style="display:flex;align-items:center;gap:10px;padding:14px 16px 6px"><a href="Main.html" aria-label="بازگشت" style="width:44px;height:44px;border-radius:14px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#17172A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a><h1 style="margin:0;font-size:19px;font-weight:900;flex:1">جلسه با سارا</h1></header>
<form style="padding:6px 16px 24px;display:flex;flex-direction:column;gap:18px">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:800">تاریخ<input value="پنج‌شنبه ۱ آذر" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border-radius:16px;border:2px solid #E9E9F2;background:#fff;font:inherit;font-size:14px;color:#17172A"></label>
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:800">ساعت<input value="۰۹:۰۰" dir="ltr" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border-radius:16px;border:2px solid #E9E9F2;background:#fff;font:inherit;font-size:14px;color:#17172A;text-align:right"></label>
</div>
<div style="margin-top:-8px;font-size:12.5px;color:#5F5F75;display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:8px 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></svg> ساعت سارا: <b style="color:#17172A">۱۱:۳۰ (تهران)</b></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:800">مدت</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">۲۵ دقیقه</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#6C5CE7;color:#fff;border:2px solid #6C5CE7">۵۰ دقیقه</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">۹۰ دقیقه</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">دلخواه</button></div></div>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:800">شیوه</span><div style="display:flex;gap:8px"><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">آنلاین</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#6C5CE7;color:#fff;border:2px solid #6C5CE7">حضوری</button></div></div>
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:800">مکان<input value="کتابخانهٔ مرکزی رتردام، طبقهٔ ۲" style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border-radius:16px;border:2px solid #E9E9F2;background:#fff;font:inherit;font-size:14px;color:#17172A">
<span style="font-weight:600;font-size:12px;color:#5F5F75;display:flex;gap:6px;align-items:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12l2.3 2.3 4.2-4.6"/></svg> جای عمومی پیشنهاد می‌شود. آدرس فقط برای سارا دیده می‌شود.</span></label>
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:800">هدف این جلسه<select style="box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border-radius:16px;border:2px solid #E9E9F2;background:#fff;font:inherit;font-size:14px;color:#17172A"><option>پایان‌نامه — فصل ۳</option></select></label>
<div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:800">تکرار</span><div style="display:flex;gap:8px"><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;color:#17172A;border:2px solid #E9E9F2">یک‌بار</button><button type="button" style="font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;background:#6C5CE7;color:#fff;border:2px solid #6C5CE7">هفتگی</button></div><div style="display:flex;gap:6px;justify-content:space-between"><button type="button" aria-pressed="false" style="width:40px;height:44px;border-radius:12px;font:inherit;font-weight:800;font-size:13px;border:2px solid #E9E9F2;background:#fff;color:#17172A">ش</button><button type="button" aria-pressed="false" style="width:40px;height:44px;border-radius:12px;font:inherit;font-weight:800;font-size:13px;border:2px solid #E9E9F2;background:#fff;color:#17172A">ی</button><button type="button" aria-pressed="true" style="width:40px;height:44px;border-radius:12px;font:inherit;font-weight:800;font-size:13px;border:2px solid #6C5CE7;background:#6C5CE7;color:#fff">د</button><button type="button" aria-pressed="false" style="width:40px;height:44px;border-radius:12px;font:inherit;font-weight:800;font-size:13px;border:2px solid #E9E9F2;background:#fff;color:#17172A">س</button><button type="button" aria-pressed="false" style="width:40px;height:44px;border-radius:12px;font:inherit;font-weight:800;font-size:13px;border:2px solid #E9E9F2;background:#fff;color:#17172A">چ</button><button type="button" aria-pressed="true" style="width:40px;height:44px;border-radius:12px;font:inherit;font-weight:800;font-size:13px;border:2px solid #6C5CE7;background:#6C5CE7;color:#fff">پ</button><button type="button" aria-pressed="false" style="width:40px;height:44px;border-radius:12px;font:inherit;font-weight:800;font-size:13px;border:2px solid #E9E9F2;background:#fff;color:#17172A">ج</button></div><div style="font-size:12px;color:#5F5F75">دوشنبه و پنج‌شنبه، تا ۶ هفته (۱۲ جلسه)</div></div>
<button type="button" style="width:100%;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:0;font:inherit;font-size:14px;font-weight:800;text-decoration:none;background:#6C5CE7;color:#fff">فرستادن پیشنهاد به سارا</button>
</form>

</div>
</body>
</html>
